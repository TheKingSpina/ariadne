[package]
name = "ariadne"
version = "0.1.0"
edition = "2021"
description = "L0 — substrato: log append-only, schema evento, catena di hash, correzioni compensative"

# Unica dipendenza di produzione: SHA-256.
[dependencies]
sha2 = "0.10"

# I test ricalcolano gli SHA-256 indipendentemente dall'implementazione (sha256_hex
# in tests/l0_event_log.rs importa sha2 direttamente): la dev-dependency resta.
[dev-dependencies]
sha2 = "0.10"

[[test]]
name = "l0_event_log"
path = "tests/l0_event_log.rs"

# Oracolo indipendente del replay AUX v2 (mandato WP3, 2026-11-05): i test
# confrontano i byte del log costruito con la sola API pubblica con il
# fixture congelato in preparazione_stress/fixtures/aux_v2_small.
[[test]]
name = "aux_v2_independent"
path = "tests/aux_v2_independent.rs"
